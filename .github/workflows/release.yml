# Publish ckpoint (the `chokepoint` command) to PyPI when a version tag (v0.1.0, ...) is pushed.
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: add a "pending publisher" for project ckpoint,
# owner/repo of this GitHub repo, workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest -q   # integration tests skip without a seeded FalkorDB server
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run check
        working-directory: frontend

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run build   # the UI ships inside the wheel (backend/web)
        working-directory: frontend
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
