# Keeps the free live site awake for visitors: Render's free tier sleeps after 15 idle minutes (about 50 s to
# wake), and /api/health also queries FalkorDB Cloud, so the database stays active too.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://chokepoint.onrender.com/api/health
